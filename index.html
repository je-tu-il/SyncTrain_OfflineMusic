<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SyncTrain — Lecteur Audio &amp; Synchro P2P Hors-Ligne</title>
    <meta name="description" content="SyncTrain : lecteur musical hors-ligne et synchronisation pair-à-pair directe sur réseau local sans Internet." />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <meta property="og:title" content="SyncTrain — Lecteur Audio &amp; Synchro Locale" />
    <meta property="og:description" content="Écoutez et synchronisez votre bibliothèque musicale hors-ligne sur votre réseau local." />
    <meta property="og:type" content="website" />
    <style>
        :root { color-scheme: dark; --bg-primary: #090e18; --bg-card: #111828; --border: #1e293f; --accent: #38bdf8; --accent-soft: rgba(56, 189, 248, 0.14); --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { max-width: 72rem; margin-inline: auto; padding: clamp(1rem, 4vw, 3rem); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg-primary); color: var(--text-main); line-height: 1.5; }
        header { display: flex; align-items: center; gap: 14px; border-bottom: 1px solid var(--border); padding-block: 1rem 1.5rem; margin-bottom: 1.5rem; }
        .brand-logo { width: 44px; height: 44px; border-radius: 12px; flex: none; }
        header p { margin-top: .25rem; color: var(--text-muted); font-size: .95rem; }
        h1 { font-size: clamp(1.6rem, 4vw, 2.4rem); font-weight: 800; letter-spacing: -.03em; line-height: 1.15; }
        .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; gap: 1.25rem; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 1rem; padding: 20px; }
        .card h2 { font-size: 1rem; line-height: 1.35; margin-bottom: .75rem; }
        .track-row { display: flex; justify-content: space-between; align-items: center; width: 100%; gap: .75rem; padding: 10px 8px; background: transparent; border: 0; border-bottom: 1px solid var(--border); color: inherit; text-align: left; font: inherit; font-size: 13px; min-height: 44px; overflow-wrap: anywhere; cursor: pointer; border-radius: 6px; }
        .track-row:hover { color: var(--accent); background: var(--accent-soft); }
        .track-duration { flex: none; font-variant-numeric: tabular-nums; color: var(--text-muted); }
        .player-bar { background: #0c1322; border-radius: 12px; border: 1px solid var(--border); padding: 16px; margin-top: 16px; text-align: center; }
        .player-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; margin-top: 10px; }
        .btn-ctrl { background: #1e293b; color: white; border: 1px solid var(--border); padding: 8px 14px; border-radius: 8px; font-weight: 700; min-height: 44px; cursor: pointer; }
        .btn-ctrl:hover:not(:disabled) { background: #293548; border-color: var(--accent); }
        .btn-ctrl:disabled { opacity: .5; cursor: default; }
        button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
        #trackList > p { color: var(--text-muted); line-height: 1.5; }
        @media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body>
    <header>
        <img src="favicon.svg" alt="Logo SyncTrain" class="brand-logo" width="44" height="44">
        <div>
            <h1>SyncTrain</h1>
            <p>Bibliothèque musicale &amp; synchronisation pair-à-pair sur réseau local</p>
        </div>
    </header>

    <main class="grid">
        <div class="card">
            <h2>Sélection des morceaux</h2>
            <p style="font-size: .875rem; color: var(--text-muted);">Cette interface affiche les titres disponibles sur le serveur local.</p>

            <div class="player-bar">
                <div style="font-size: .875rem; color: var(--text-muted);">Morceau sélectionné</div>
                <div style="font-size: 16px; font-weight: 800; margin: 6px 0;" id="nowPlaying" aria-live="polite">Aucun morceau sélectionné</div>
                <div class="player-controls">
                    <button type="button" class="btn-ctrl" id="previousTrack" disabled>Précédent</button>
                    <button type="button" class="btn-ctrl" id="shuffleTracks" disabled>Au hasard</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2>Bibliothèque locale</h2>
            <div id="trackList" aria-live="polite"><p>Chargement des pistes…</p></div>
        </div>
    </main>

    <script>
        let tracks = [];
        let currentTrack = -1;
        async function load() {
            const list = document.getElementById('trackList');
            try {
                const response = await fetch('/api/sync_music');
                if (!response.ok) throw new Error('Bibliothèque indisponible');
                const data = await response.json();
                tracks = Array.isArray(data.tracks) ? data.tracks : [];
            } catch {
                list.firstElementChild.textContent = 'Impossible de charger les pistes. Actualisez la page pour réessayer.';
                return;
            }

            if (tracks.length === 0) {
                list.firstElementChild.textContent = 'Aucune piste dans le dossier synchronisé.';
                return;
            }

            list.replaceChildren(...tracks.map((track, index) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'track-row';
                row.addEventListener('click', () => playTrack(index));

                const label = document.createElement('div');
                const title = document.createElement('strong');
                const artist = document.createElement('span');
                title.textContent = track.title;
                artist.textContent = track.artist;
                label.append(title, document.createElement('br'), artist);

                const duration = document.createElement('span');
                duration.className = 'track-duration';
                duration.textContent = track.duration;
                row.append(label, duration);
                return row;
            }));
            document.getElementById('previousTrack').disabled = false;
            document.getElementById('shuffleTracks').disabled = false;
        }
        function playTrack(index) {
            if (index < 0 || index >= tracks.length) return;
            currentTrack = index;
            const t = tracks[index];
            document.getElementById('nowPlaying').textContent = `${t.title} — ${t.artist}`;
        }
        document.getElementById('previousTrack').addEventListener('click', () => {
            if (!tracks.length) return;
            playTrack((currentTrack - 1 + tracks.length) % tracks.length);
        });
        document.getElementById('shuffleTracks').addEventListener('click', () => {
            if (!tracks.length) return;
            playTrack(Math.floor(Math.random() * tracks.length));
        });
        load();
    </script>
</body>
</html>
