<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SyncTrain OfflineMusic · Bibliothèque locale</title>
    <style>
        :root { --bg-primary: #090e18; --bg-card: #111828; --border: #1e293f; --accent: #0284c7; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg-primary); color: var(--text-main); padding: 24px; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 16px; margin-bottom: 24px; }
        h1 { font-size: 20px; font-weight: 800; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; }
        .track-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; cursor: pointer; }
        .track-row:hover { color: #38bdf8; }
        .player-bar { background: #0c1322; border-radius: 12px; border: 1px solid var(--border); padding: 16px; margin-top: 16px; text-align: center; }
        .btn-ctrl { background: #1e293b; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 700; margin: 0 4px; cursor: pointer; }
        :root { color-scheme: dark; --bg-primary: #101615; --bg-card: #18211f; --border: #354541; --text-muted: #b3c5be; }
        body { max-width: 72rem; margin-inline: auto; padding: clamp(1rem, 4vw, 3rem); font-family: system-ui, sans-serif; }
        header { padding-block: 1rem 1.5rem; }
        header p { margin-top: .5rem; }
        h1 { font-size: clamp(2rem, 7vw, 3.6rem); letter-spacing: -.045em; line-height: 1.1; }
        .grid { grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); align-items: start; gap: 1rem; }
        .card { border-radius: 1rem; }
        .card h2 { line-height: 1.35; }
        .track-row { width: 100%; gap: .75rem; background: transparent; border: 0; border-bottom: 1px solid var(--border); color: inherit; text-align: left; font: inherit; min-height: 44px; overflow-wrap: anywhere; }
        .track-duration { flex: none; font-variant-numeric: tabular-nums; }
        .player-bar { background: #101615; }
        .player-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: .5rem; }
        .btn-ctrl { margin: 0; min-height: 44px; background: #2b3b36; }
        .btn-ctrl:disabled { opacity: .55; cursor: default; }
        button:focus-visible { outline: 2px solid #9de4cb; outline-offset: 3px; }
        #trackList > p { color: var(--text-muted); line-height: 1.5; }
        @media (max-width: 700px) { .grid { grid-template-columns: minmax(0, 1fr); } }
    </style>
</head>
<body>
    <header>
        <h1>SyncTrain OfflineMusic</h1>
        <p style="color: var(--text-muted);">Bibliothèque musicale et synchronisation sur le réseau local</p>
    </header>

    <main class="grid">
        <div class="card">
            <h2 style="font-size: 16px; margin-bottom: 8px;">Sélection des morceaux</h2>
            <p style="font-size: .875rem; color: var(--text-muted);">Cette interface affiche les titres disponibles sur le serveur local.</p>

            <div class="player-bar">
                <div style="font-size: .875rem; color: var(--text-muted);">Morceau sélectionné</div>
                <div style="font-size: 16px; font-weight: 800; margin: 6px 0;" id="nowPlaying" aria-live="polite">Aucun morceau sélectionné</div>
                <div class="player-controls">
                    <button type="button" class="btn-ctrl" id="previousTrack" disabled>Précédent</button>                    <button type="button" class="btn-ctrl" id="shuffleTracks" disabled>Au hasard</button>
                </div>
            </div>
        </div>

        <div class="card">
            <h2 style="font-size: 16px; margin-bottom: 12px;">Bibliothèque locale</h2>
            <div id="trackList" aria-live="polite"><p>Chargement des pistes…</p></div>
        </div>
    </main>

    <script>
        let tracks = [];
        let currentTrack = -1;
        async function load() {
            const list = document.getElementById('trackList');
            try {
                const response = await fetch('/api/sync_music');
                if (!response.ok) throw new Error('Bibliothèque indisponible');
                const data = await response.json();
                tracks = Array.isArray(data.tracks) ? data.tracks : [];
            } catch {
                list.firstElementChild.textContent = 'Impossible de charger les pistes. Actualisez la page pour réessayer.';
                return;
            }

            if (tracks.length === 0) {
                list.firstElementChild.textContent = 'Aucune piste dans le dossier synchronisé.';
                return;
            }

            list.replaceChildren(...tracks.map((track, index) => {
                const row = document.createElement('button');
                row.type = 'button';
                row.className = 'track-row';
                row.addEventListener('click', () => playTrack(index));

                const label = document.createElement('div');
                const title = document.createElement('strong');
                const artist = document.createElement('span');
                title.textContent = track.title;
                artist.textContent = track.artist;
                label.append(title, document.createElement('br'), artist);

                const duration = document.createElement('span');
                duration.className = 'track-duration';
                duration.textContent = track.duration;
                row.append(label, duration);
                return row;
            }));
            document.getElementById('shuffleTracks').disabled = false;
        }

        function playTrack(index) {
            currentTrack = index;
            document.getElementById('nowPlaying').textContent = tracks[index].title;
            document.getElementById('previousTrack').disabled = index === 0;
        }
        function previousTrack() { if (currentTrack > 0) playTrack(currentTrack - 1); }
        function randomTrack() {
            if (tracks.length > 0) playTrack(Math.floor(Math.random() * tracks.length));
        }
        document.getElementById('previousTrack').addEventListener('click', previousTrack);
        document.getElementById('shuffleTracks').addEventListener('click', randomTrack);
        window.onload = load;
    </script>
</body>
</html>
