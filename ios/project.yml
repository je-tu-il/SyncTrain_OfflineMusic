name: SyncTrain
options:
  bundleIdPrefix: com.jetuil.synctrain
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
    DEVELOPMENT_TEAM: ""
targets:
  SyncTrain:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: SyncTrain
        excludes:
          - "Info.plist"
          - "Resources/**"
      - path: SyncTrain/Resources/offline_companion.html
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: SyncTrain
        PRODUCT_BUNDLE_IDENTIFIER: com.jetuil.synctrain.offlinemusic
        INFOPLIST_FILE: SyncTrain/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
schemes:
  SyncTrain:
    build:
      targets:
        SyncTrain: all
    run:
      config: Debug
    archive:
      config: Release
